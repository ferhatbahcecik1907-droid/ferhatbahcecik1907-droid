<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dizi Takip</title><style>:root{--bg:#090b10;--card:#121722;--card2:#191f2d;--line:#2b3548;--txt:#f3f6fb;--muted:#9ba8bd;--accent:#6d5dfc;--accent2:#23c6a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 100% -5%,#35277266,transparent 65%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.eyebrow{margin:0;color:#a99fff;font-size:12px;font-weight:900;letter-spacing:.13em}h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.055em;line-height:1;margin:8px 0}p{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:20px;background:#121722;padding:18px}.add{display:grid;grid-template-columns:1fr 110px;gap:10px}.add input,.add button,button{font:inherit;border-radius:11px;padding:12px}.add input{border:1px solid var(--line);background:#0d1119;color:#fff;outline:none}button{border:0;color:#fff;background:var(--accent);font-weight:850;cursor:pointer}.empty{padding:48px 18px;text-align:center;color:var(--muted)}.show{margin-top:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}.showhead{padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center;background:#171d2b}.showhead h2{margin:0;font-size:20px}.showhead small{display:block;color:var(--muted);margin-top:5px}.delete{background:#40212a;color:#ffadb7;padding:9px 12px;font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 16px 0}.tab{white-space:nowrap;background:#202839;border:1px solid #33405a;color:#c8d0df;padding:9px 12px;font-size:13px}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.season{padding:16px}.progressrow{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.progressrow b{color:#fff}.track{height:9px;border-radius:99px;background:#252d3c;overflow:hidden;margin:10px 0 15px}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools button{background:#222b3d;color:#dce3ef;font-size:13px;padding:9px 11px}.tools .finish{background:#153b36;color:#8ef2dd}.tools .clear{background:#40212a;color:#ffadb7}.episodes{display:grid;gap:8px}.episode{width:100%;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:11px;text-align:left;background:var(--card2);border:1px solid transparent;padding:12px;border-radius:12px;color:#fff}.episode.done{border-color:#2d9e89;background:#162c2b}.check{width:27px;height:27px;border-radius:50%;border:2px solid #68758d;display:grid;place-items:center;color:transparent}.episode.done .check{background:var(--accent2);border-color:var(--accent2);color:#08211d}.episode span:last-child{color:var(--muted);font-size:12px}@media(max-width:560px){.wrap{padding:20px 13px}.add{grid-template-columns:1fr}.episode span:last-child{display:none}}</style></head><body><main class="wrap"><p class="eyebrow">YENİ BAŞLANGIÇ</p><h1>Dizi Takip</h1><p>Sezon ve bölüm ilerlemeni temiz, basit şekilde takip et.</p><section class="panel"><div class="add"><input id="title" placeholder="Dizi adı yaz" autocomplete="off"><button id="add">Dizi ekle</button></div><div id="list"></div></section></main><script>const KEY='diziTakip.clean.v1',$=s=>document.querySelector(s);let shows=JSON.parse(localStorage.getItem(KEY)||'[]'),open={};const save=()=>localStorage.setItem(KEY,JSON.stringify(shows));const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const find=id=>shows.find(x=>x.id===id);function render(){let r=$('#list');if(!shows.length){r.innerHTML='<div class="empty">Henüz dizi yok. Yukarıdan bir dizi ekleyerek başla.</div>';return}r.innerHTML=shows.map(x=>{let si=open[x.id]??0,s=x.seasons[si],d=s.watched.length,t=s.episodes,p=Math.round(d/t*100);return `<article class="show"><div class="showhead"><div><h2>${esc(x.title)}</h2><small>${x.seasons.length} sezon · Bu sezon ${d}/${t} bölüm</small></div><button class="delete" data-del="${x.id}">Sil</button></div><div class="tabs">${x.seasons.map((z,i)=>`<button class="tab ${i===si?'on':''}" data-tab="${x.id}|${i}">${esc(z.name)}</button>`).join('')}<button class="tab" data-new="${x.id}">+ Sezon</button></div><section class="season"><div class="progressrow"><span>İlerleme</span><b>${d} / ${t} bölüm · %${p}</b></div><div class="track"><i style="width:${p}%"></i></div><div class="tools"><button class="finish" data-all="${x.id}|${si}">Sezonu tamamla</button><button class="clear" data-clear="${x.id}|${si}">Sezonu temizle</button></div><div class="episodes">${Array.from({length:t},(_,i)=>{let n=i+1,on=s.watched.includes(n);return `<button class="episode ${on?'done':''}" data-ep="${x.id}|${si}|${n}"><span class="check">✓</span><span><b>Bölüm ${n}</b></span><span>${on?'İzlendi':'İzlenmedi'}</span></button>`}).join('')}</div></section></article>`}).join('')}$('#add').onclick=()=>{let title=$('#title').value.trim(),eps=Number(prompt('İlk sezonda kaç bölüm var?','10'));if(!title||!Number.isInteger(eps)||eps<1)return;shows.unshift({id:crypto.randomUUID(),title,seasons:[{name:'Sezon 1',episodes:eps,watched:[]}]});$('#title').value='';save();render()};$('#title').onkeydown=e=>e.key==='Enter'&&$('#add').click();$('#list').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.del){shows=shows.filter(x=>x.id!==b.dataset.del);save();render();return}if(b.dataset.tab){let[a,i]=b.dataset.tab.split('|');open[a]=+i;render();return}if(b.dataset.new){let x=find(b.dataset.new),n=Number(prompt('Yeni sezonda kaç bölüm var?','10'));if(Number.isInteger(n)&&n>0){x.seasons.push({name:'Sezon '+(x.seasons.length+1),episodes:n,watched:[]});open[x.id]=x.seasons.length-1;save();render()}return}let k=b.dataset.ep||b.dataset.all||b.dataset.clear;if(!k)return;let[a,i,n]=k.split('|'),s=find(a).seasons[+i];if(b.dataset.ep)s.watched=s.watched.includes(+n)?s.watched.filter(v=>v!==+n):[...s.watched,+n];if(b.dataset.all)s.watched=Array.from({length:s.episodes},(_,j)=>j+1);if(b.dataset.clear)s.watched=[];save();render()};render()</script></body></html>
